name: Build Android Chess Analyzer

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  STOCKFISH_TAG: sf_17.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The app source is stored compressed at the bottom of this file
      - name: Extract project from this file
        run: |
          F=.github/workflows/android.yml
          if ! grep -q '^#PAYLOAD_END' "$F"; then echo "ERROR: android.yml is incomplete (cut off while copying). Re-upload the full file."; exit 1; fi
          sed -n '/^#PAYLOAD_BEGIN/,/^#PAYLOAD_END/p' "$F" | grep '^# ' | cut -c3- | base64 -d | tar xz
          ls -R app | head -30

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Cache the compiled engine so it's only rebuilt when the tag changes
      - name: Cache Stockfish binary
        id: sf-cache
        uses: actions/cache@v4
        with:
          path: stockfish-out
          key: stockfish-${{ env.STOCKFISH_TAG }}-arm64-v8a

      - name: Build Stockfish for Android (arm64-v8a, NNUE embedded)
        if: steps.sf-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$STOCKFISH_TAG" https://github.com/official-stockfish/Stockfish.git
          cd Stockfish/src
          NDK_BIN="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"
          # Downloads the NNUE nets and embeds them in the binary -> fully offline at runtime
          make -j"$(nproc)" build ARCH=armv8 COMP=ndk
          "$NDK_BIN/llvm-strip" stockfish
          mkdir -p "$GITHUB_WORKSPACE/stockfish-out"
          cp stockfish "$GITHUB_WORKSPACE/stockfish-out/libstockfish.so"

      # Android only runs executables from the native lib dir, so the engine ships as libstockfish.so
      - name: Install engine into jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp stockfish-out/libstockfish.so app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessAnalyzer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publishes the APK as a release so it can be downloaded straight from a phone
      - name: Publish APK as release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ChessAnalyzer.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ChessAnalyzer.apk --title "Chess Analyzer (latest build)" --notes "Download ChessAnalyzer.apk and install it."

