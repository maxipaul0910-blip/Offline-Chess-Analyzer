name: Build Android Chess Analyzer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  STOCKFISH_TAG: sf_17.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Cache the compiled engine so it's only rebuilt when the tag changes
      - name: Cache Stockfish binary
        id: sf-cache
        uses: actions/cache@v4
        with:
          path: stockfish-out
          key: stockfish-${{ env.STOCKFISH_TAG }}-arm64-v8a

      - name: Build Stockfish for Android (arm64-v8a, NNUE embedded)
        if: steps.sf-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$STOCKFISH_TAG" https://github.com/official-stockfish/Stockfish.git
          cd Stockfish/src
          NDK_BIN="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"
          export ANDROID_NDK_BIN="$NDK_BIN"
          # Downloads the NNUE nets and embeds them in the binary -> fully offline at runtime
          make -j"$(nproc)" build ARCH=armv8 COMP=ndk
          "$NDK_BIN/llvm-strip" stockfish
          mkdir -p "$GITHUB_WORKSPACE/stockfish-out"
          cp stockfish "$GITHUB_WORKSPACE/stockfish-out/libstockfish.so"

      # Android only lets apps exec files from nativeLibraryDir, so the engine ships
      # as libstockfish.so and is launched via ProcessBuilder (UCI over stdin/stdout).
      # In the app: android:extractNativeLibs="true" (or useLegacyPackaging = true).
      - name: Install engine into jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp stockfish-out/libstockfish.so app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-analyzer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
