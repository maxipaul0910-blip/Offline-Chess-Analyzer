                          loss < 0.02 && sacrificed && matched != null && wpBest < 0.80 && wpPlayed > 0.45 && !isRecapture -> Cls.BRILLIANT
                          isBest && gap >= 0.15 && wpBest < 0.95 && !isRecapture -> Cls.GREAT
                          isBest -> Cls.BEST
                          loss < 0.02 -> Cls.EXCELLENT
                          else -> Cls.GOOD
                      }

                      val bestSan = best.pv.firstOrNull()?.let { uciToSan(fens[i], it) } ?: ""
                      val evalBeforeW = if (whiteMoved) best.cp else -best.cp
                      val evalAfterW = if (whiteMoved) playedCp else -playedCp
                      val mateAfterW = playedMate?.let { if (whiteMoved) it else -it }
                      val mateBeforeW = best.mate?.let { if (whiteMoved) it else -it }
                      val swing = "Eval: ${fmt(evalBeforeW, mateBeforeW)} → ${fmt(evalAfterW, mateAfterW)}"

                      val explanation = when (cls) {
                          Cls.BRILLIANT -> "Brilliant! You gave up your ${name(moved)} on $toSq, but the engine confirms the idea works out."
                          Cls.GREAT -> "Great move! It was the key move here — the alternatives were much worse."
                          Cls.BEST -> "Best move — the engine's top choice."
                          Cls.EXCELLENT -> "Excellent — nearly as strong as the best move ($bestSan)."
                          Cls.GOOD -> "Good move. The engine slightly preferred $bestSan."
                          else -> {
                              val head = "$san is ${if (cls == Cls.BLUNDER) "a blunder" else if (cls == Cls.MISTAKE) "a mistake" else "an inaccuracy"}."
                              val reason = when {
                                  best.mate != null && best.mate > 0 && !(playedMate != null && playedMate > 0) ->
                                      "You missed a forced checkmate in ${best.mate}."
                                  playedMate != null && playedMate < 0 ->
                                      "This allows checkmate in ${-playedMate}."
                                  else -> {
                                      val reply = after.pv.firstOrNull()
                                      val replyCap = reply?.let {
                                          try { afterBoard.getPiece(Move(it, afterBoard.sideToMove).to) } catch (e: Exception) { Piece.NONE }
                                      } ?: Piece.NONE
                                      val bestCap = best.pv.firstOrNull()?.let {
                                          try { before.getPiece(Move(it, before.sideToMove).to) } catch (e: Exception) { Piece.NONE }
                                      } ?: Piece.NONE
                                      when {
                                          replyCap != Piece.NONE ->
                                              "Now the opponent can play ${uciToSan(fens[i + 1], reply!!)} and win your ${name(replyCap)}."
                                          bestCap != Piece.NONE ->
                                              "You missed the chance to win the ${name(bestCap)} on ${best.pv[0].substring(2, 4)}."
                                          else -> "The position got worse than it needed to."
                                      }
                                  }
                              }
                              "$head Better was $bestSan. $reason"
                          }
                      } + "\n" + swing

                      lastCaptureSquare = if (captured != Piece.NONE) toSq else null

                      val acc = (103.1668 * exp(-0.04354 * loss * 100) - 3.1669).coerceIn(0.0, 100.0)
                      accSum[side] += acc; accCnt[side]++
                      counts[side][cls] = (counts[side][cls] ?: 0) + 1

                      infos.add(
                          MoveInfo(
                              san = san, uci = uci, whiteMoved = whiteMoved,
                              moveNumber = before.moveCounter,
                              fenAfter = fens[i + 1], cls = cls, explanation = explanation,
                              evalWhiteCp = evalAfterW, evalText = fmt(evalAfterW, mateAfterW),
                          )
